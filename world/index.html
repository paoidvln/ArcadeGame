<script>

// the fight: it circles the arena, throws fireballs, then dives at you and lands to rest; only a resting Phoenix can be hit
function bossTick(dt){const B=BOSS;if(!B.on)return;if(!inArena()){B.on=false;B.shots=[];MUSIC.set(WORLD_SONG);return}
  B.t-=dt;B.flash=Math.max(0,B.flash-dt);const fast=B.phase===2?1.35:1;B.trail.unshift({x:B.x,y:B.y-B.alt});if(B.trail.length>14)B.trail.pop();
  if(B.st==='fly'){const k=time*.8*fast,tx=ARENA_C.x+Math.cos(k)*70,ty=ARENA_C.y-10+Math.sin(k*2)*30;B.x+=(tx-B.x)*Math.min(1,dt*2);B.y+=(ty-B.y)*Math.min(1,dt*2);B.alt+=(22-B.alt)*Math.min(1,dt*3);
    if(B.t<=0){B.n++;if(B.n%2){B.st='volley';B.t=.3;B.k=B.phase===2?6:4}else{B.st='aim';B.t=.8;B.tx=P.x;B.ty=P.y;SFX.play('swing')}}}
  else if(B.st==='volley'){if(B.t<=0){B.t=.28/fast;B.k--;fireAt(B.x,B.y-B.alt,P.x,P.y-6,85*fast,(Math.random()-.5)*.25);SFX.play('tick');if(B.k<=0){B.st='fly';B.t=2.2/fast}}}

/* ---------- one step of the game ---------- */
function tick(dt){if(!started||paused||rotOn)return;time+=dt;
  if(EQUIP.on){equipTick(dt);P.mov=false;NET.others.forEach(o=>{o.x+=(o.tx-o.x)*Math.min(1,dt*10);o.y+=(o.ty-o.y)*Math.min(1,dt*10)});bflyTick(dt);netTick(dt);return}
  let mx=0,my=0;if(!typing()){if(keys.ArrowLeft||keys.a)mx--;if(keys.ArrowRight||keys.d)mx++;if(keys.ArrowUp||keys.w)my--;if(keys.ArrowDown||keys.s)my++}
  if(joy.x||joy.y){mx=joy.x;my=joy.y}
  if(P.seat&&(mx||my||(P.path&&P.path.length)))stand();
  if(P.tgt&&!P.tgt.dead&&!mx&&!my){const d=Math.hypot(P.tgt.x-P.x,P.tgt.y-P.y);if(d<22){P.path=null;attack()}else if(!P.path||!P.path.length||(P.rp=(P.rp||0)-dt)<=0){P.rp=.5;P.path=findPath(Math.floor(P.tgt.x/T),Math.floor(P.tgt.y/T),true)}}
  if(mx||my){P.path=null;P.then=null;P.tgt=null;const l=Math.hypot(mx,my),sp=SPEED*dt,nx=P.x+mx/l*sp,ny=P.y+my/l*sp;if(!blocked(nx,P.y))P.x=nx;if(!blocked(P.x,ny))P.y=ny;P.mov=true;if(Math.abs(mx)>.25)P.f=mx<0?-1:1;P.d=Math.abs(my)>Math.abs(mx)?(my>0?0:1):2}
  else if(P.path&&P.path.length){const[tx,ty]=P.path[0],dx=tx-P.x,dy=ty-P.y,d=Math.hypot(dx,dy),sp=SPEED*dt;
    if(d<=sp){P.x=tx;P.y=ty;P.path.shift();if(!P.path.length&&P.then){const f=P.then;P.then=null;f()}}else{P.x+=dx/d*sp;P.y+=dy/d*sp;if(Math.abs(dx)>.5)P.f=dx<0?-1:1;P.d=Math.abs(dy)>Math.abs(dx)?(dy>0?0:1):2}P.mov=true}
  else P.mov=false;
  P.cd=Math.max(0,P.cd-dt);P.slash=Math.max(0,P.slash-dt);P.inv=Math.max(0,P.inv-dt);
  if(P.hp<maxHP()&&!BOSS.on&&(P.regen+=dt)>6){P.regen=0;P.hp++;hud()}
  // things to pick up (only while their quest is active)
  const want={f:QUESTS.some(q=>q.kind==='f'&&qs(q)==='a'),w:QUESTS.some(q=>q.kind==='w'&&qs(q)==='a')};
  ITEMS.forEach(it=>{if(it.off>0){it.off-=dt;return}if(want[it.k]&&Math.hypot(it.x-P.x,it.y-P.y)<11){it.off=25;SFX.play('tick');progress(it.k)}});
  if(qs(QUESTS[2])==='a'&&Math.hypot(SHRINE.x-P.x,SHRINE.y-P.y)<40){toast('You found the old shrine!');progress('shrine')}
  if(!S.chest&&Math.floor(P.x/T)===CHEST.tx&&Math.floor(P.y/T)===CHEST.ty){S.chest=true;toast('A hidden chest! +50 gold');SFX.play('win');reward(50,20)}
  slimes.forEach(s=>{if(s.dead){if((s.resp-=dt)<=0)placeSlime(s);return}s.hit=Math.max(0,s.hit-dt);
    if((s.t-=dt)<=0){s.t=.8+Math.random()*1.2;const d=Math.hypot(P.x-s.x,P.y-s.y);if(d<70){s.vx=(P.x-s.x)/d*24;s.vy=(P.y-s.y)/d*24}else{const a=Math.random()*6.28,m=Math.random()<.4?0:16;s.vx=Math.cos(a)*m;s.vy=Math.sin(a)*m}}

  ctx.drawImage(TOPIMG,-cam.x,-cam.y);
  WORLD.chims.forEach(([x,y],i)=>{for(let k=0;k<3;k++){const a=(time*.35+k/3+i*.2)%1,sz=2+(a*3|0);ctx.globalAlpha=.55*(1-a);ctx.fillStyle='#eceaf5';ctx.fillRect(Math.round(x-cam.x+Math.sin((a+k)*5)*3),Math.round(y-cam.y-a*18),sz,sz)}});ctx.globalAlpha=1;
  const night=(Math.sin(time/90)+1)/2;if(night>.55){const k=(night-.55)/.45;ctx.fillStyle='rgba(12,14,60,'+(k*.42).toFixed(3)+')';ctx.fillRect(0,0,VW,VH);ctx.globalCompositeOperation='lighter';
    GLOW.forEach(([x,y])=>{[[22,.05],[14,.08],[7,.13]].forEach(([r,a])=>{ctx.fillStyle='rgba(255,190,90,'+(a*k).toFixed(3)+')';ctx.fillRect(Math.round(x-cam.x)-r,Math.round(y-cam.y)-r,r*2,r*2)})});ctx.globalCompositeOperation='source-over'}
  NPCS.forEach(n=>{label(n.n,n.x,n.y-28,'#ffd66b',true);const mark=QUESTS.some(q=>q.npc===n.id&&qs(q)==='r')?'?':QUESTS.some(q=>q.npc===n.id&&(qs(q)===''||(q.rep&&qs(q)==='c')))&&!QUESTS.some(q=>q.npc===n.id&&qs(q)==='a')?'!':'';
    if(mark)label(mark,n.x,n.y-36-(Math.floor(time*2)%2),mark==='?'?'#6ff7ff':'#ffd66b')});
  NET.others.forEach(o=>{label(o.n+' · Lv '+o.lv,o.x,o.y-28,'#fff');if(o.say&&o.sayT>time)label(o.say,o.x,o.y-37,'#fff',true)});
  TABLES.forEach(tb=>{const X=tb.x*T,Y=tb.y*T;if(X<cam.x-80||X>cam.x+VW+40||Y<cam.y-60||Y>cam.y+VH+60)return;if(tb.deco)return label(tb.n,X+16,Y-26,'#ff9ad0',true);
    const n=seatedAt(tb).length;label(tb.n+' · '+n+'/'+tb.max,X+16,tb.max>2?Y-42:Y-12,n>=tb.min?'#7dffb0':'#ffd66b',true)});
  label('Phoenix Portal · Lv 20',PORTAL_OUT.tx*T+8,(PORTAL_OUT.ty+1)*T+14,'#fb923c',true);label('Exit',PORTAL_IN.tx*T+8,PORTAL_IN.ty*T-16,'#fde047',true);
  POPS.forEach(q=>label(q.t,q.x,q.y,q.c,false));
  if(BOSS.on){const B=BOSS,w=Math.min(uic.width*.6,420),x0=(uic.width-w)/2,y0=78;ux.fillStyle='#000c';ux.fillRect(x0-8,y0-26,w+16,44);ux.font='22px VT323,monospace';ux.textAlign='center';ux.fillStyle='#fde047';
    ux.fillText(B.phase===2?'PHOENIX — REBORN':'PHOENIX',uic.width/2,y0-6);ux.fillStyle='#3d1a10';ux.fillRect(x0,y0,w,10);ux.fillStyle=B.phase===2?'#fb923c':'#dc2626';ux.fillRect(x0,y0,w*Math.max(0,B.hp)/B.max,10);ux.fillStyle='#ffffff55';ux.fillRect(x0,y0,w*Math.max(0,B.hp)/B.max,2)}
  label('★ PIXEL ARCADE ★',26*T,43*T-15,'#ffffff',false);label('↓ Arcade Hall',26*T,37*T+2,'#ff9ad0',true);
  if(EQUIP.on&&EQUIP.sw)label('✦ '+EQUIP.name+' ✦',P.x,P.y-44-Math.round((EQUIP.t-.95)*8),'#fde047',true);
  label(S.name,P.x,P.y-28,'#9fe0b0');if(mySay&&mySayT>time)label(mySay,P.x,P.y-37,'#fff',true)}
let last=0;function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;tick(dt);if(started)draw();requestAnimationFrame(frame)}

/* ---------- chat ---------- */
let mySay='',mySayT=0,lastSent=0;
function addChat(n,m,sys){const l=$('#clog'),d=el('div',sys?'sys':'');if(!sys)d.append(el('b',null,n+': '));d.append(m);l.append(d);while(l.children.length>5)l.firstChild.remove()}
const cleanMsg=m=>String(m||'').replace(/[\u0000-\u001f]/g,' ').replace(/\s+/g,' ').trim().slice(0,120);
$('#cin').addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==$('#cin'))document.body.classList.remove('chatting')},150));
$('#cform').onsubmit=e=>{e.preventDefault();const inp=$('#cin'),m=cleanMsg(inp.value);if(!m)return inp.blur();if(Date.now()-lastSent<800)return;lastSent=Date.now();inp.value='';document.body.classList.remove('chatting');
  addChat(S.name,m);mySay=m.slice(0,40);mySayT=time+4;netChat(m);progress('chat');inp.blur()};

/* ---------- other players: peer-to-peer worlds (no server) ---------- */
const NET={peer:null,host:false,hc:null,conns:new Map(),pl:new Map(),others:new Map(),id:'',gen:0,acc:0,bacc:0,wait:0,world:0};
// #w=name in the link opens a separate, private copy of the world (handy for a group of friends, or for testing)
const WTAG=(new URLSearchParams(location.hash.slice(1)).get('w')||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,16),WID=i=>'pixarcade-world1-'+(WTAG?WTAG+'-':'')+'abcd'[i],MAXP=14;
function netStatus(t){$('#net').textContent=t}
function countOn(){const n=NET.others.size+1;netStatus('👥 '+n+(n===1?' player':' players')+(NET.world?' · world '+(NET.world+1):''))}
function myState(){return{t:'s',n:S.name,x:Math.round(P.x),y:Math.round(P.y),f:P.f,d:P.d|0,m:P.mov?1:0,lv:S.lv,lk:S.look,seat:P.seat}}
function safeState(d){return{n:clean(d.n,'Player'),tx:Math.min(MW*T,Math.max(0,+d.x||0)),ty:Math.min(MH*T,Math.max(0,+d.y||0)),f:d.f<0?-1:1,d:[0,1,2].includes(d.d)?d.d:0,m:!!d.m,lv:Math.min(999,Math.max(1,d.lv|0)),lk:safeLook(d.lk),seat:TABLES.some(t=>t.id===d.seat&&!t.deco)?d.seat:''}}
function upsert(id,d){const s=safeState(d);let o=NET.others.get(id);if(!o){o=Object.assign({x:s.tx,y:s.ty,say:'',sayT:0},s);NET.others.set(id,o);countOn()}else Object.assign(o,s);o.seen=Date.now()}
function netLeave(){NET.gen++;try{NET.peer&&NET.peer.destroy()}catch(e){}NET.peer=null;NET.hc=null;NET.conns.clear();NET.pl.clear();NET.others.clear();NET.host=false}
function netRetry(){netLeave();netStatus('connecting…');clearTimeout(NET.wait);NET.wait=setTimeout(()=>netJoin(0),1200+Math.random()*2500)}
function netJoin(i){if(!window.Peer){netStatus('offline');if(document.readyState!=='complete')addEventListener('load',()=>netJoin(0),{once:true});return}if(i>3)return netRetry();netLeave();const g=NET.gen,p=new Peer(WID(i));NET.peer=p;let open=false;netStatus('connecting…');
  p.on('open',()=>{if(g!==NET.gen)return;open=true;NET.host=true;NET.id='host';NET.world=i;countOn()});
  p.on('connection',c=>{if(g!==NET.gen)return;
    c.on('open',()=>{if(NET.conns.size>=MAXP){try{c.send({t:'full'})}catch(e){}setTimeout(()=>c.close(),400);return}NET.conns.set(c.peer,c);c.last=0});
    c.on('data',d=>{if(g!==NET.gen||!d||typeof d!=='object'||!NET.conns.has(c.peer))return;
      if(d.t==='probe'){try{c.send({t:'here',n:NET.others.size})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},300);return}
      if(d.t==='s'){const isNew=!NET.others.has(c.peer);upsert(c.peer,d);if(isNew)hostSay(null,NET.others.get(c.peer).n+' joined the world',true)}
      else if(d.t==='c'){const now=Date.now();if(now-c.last<700)return;c.last=now;const m=cleanMsg(d.m),o=NET.others.get(c.peer);if(m&&o)hostSay(c.peer,m)}
      else if(d.t==='g'){const now=Date.now();if(now-(c.lastG||0)<3000||!Array.isArray(d.ids))return;c.lastG=now;const m={t:'g',from:c.peer,table:String(d.table),code:String(d.code),ids:d.ids.slice(0,4).map(String)};
        if(!m.ids.includes(c.peer))return;NET.conns.forEach(x=>{try{x.send(m)}catch(e){}});goHere(m)}});
    const bye=()=>{if(g!==NET.gen)return;const o=NET.others.get(c.peer);NET.conns.delete(c.peer);NET.others.delete(c.peer);if(o)hostSay(null,o.n+' left',true);countOn()};c.on('close',bye);c.on('error',bye)});
  p.on('error',e=>{if(g!==NET.gen)return;if(e.type==='unavailable-id')netClient(i);else if(!open)netRetry()});
  p.on('disconnected',()=>{if(g===NET.gen)try{p.reconnect()}catch(e){}})}
function netClient(i){netLeave();const g=NET.gen,p=new Peer();NET.peer=p;
  p.on('open',id=>{if(g!==NET.gen)return;NET.id=id;const c=p.connect(WID(i),{reliable:true,serialization:'json'});NET.hc=c;let ok=false,full=false;const to=setTimeout(()=>{if(g===NET.gen&&!ok){netLeave();netStatus('connecting…');clearTimeout(NET.wait);NET.wait=setTimeout(()=>netJoin(i+1),300)}},6000);
    c.on('open',()=>{if(g!==NET.gen)return;ok=true;clearTimeout(to);NET.world=i;countOn();sendState(true)});
    c.on('data',d=>{if(g!==NET.gen||!d||typeof d!=='object')return;
      if(d.t==='full'){full=true;netJoin(i+1)}
      else if(d.t==='w'&&d.p&&typeof d.p==='object'){const ids=Object.keys(d.p).slice(0,MAXP+2);ids.forEach(k=>{if(k!==NET.id)upsert(k,d.p[k])});NET.others.forEach((o,k)=>{if(!ids.includes(k))NET.others.delete(k)});countOn()}
      else if(d.t==='c')gotChat(d)
      else if(d.t==='g')goHere(d)
      else if(d.t==='move'){netLeave();netStatus('connecting…');clearTimeout(NET.wait);NET.wait=setTimeout(()=>netJoin(0),1500+Math.random()*1500)}});
    c.on('close',()=>{if(g===NET.gen&&!full)netRetry()})});
  p.on('error',()=>{if(g===NET.gen)netRetry()})}
function probeLower(){if(!NET.host||!NET.world||!NET.peer||NET.probing||paused)return;NET.probing=true;const g=NET.gen,me=NET.peer;let j=0;
  const next=()=>{if(g!==NET.gen||j>=NET.world){NET.probing=false;return}let done=false;const c=me.connect(WID(j),{reliable:true,serialization:'json'});
    const fin=(alive,n)=>{if(done)return;done=true;clearTimeout(to);try{c.close()}catch(e){}if(g!==NET.gen){NET.probing=false;return}
      if(alive&&n+NET.others.size+1<=MAXP){NET.probing=false;return moveAll()}j++;next()};
    const to=setTimeout(()=>fin(false),5000);
    c.on('open',()=>{try{c.send({t:'probe'})}catch(e){}});
    c.on('data',d=>{if(d&&d.t==='here')fin(true,d.n|0);else if(d&&d.t==='full')fin(false)});c.on('error',()=>fin(false))};
  next()}
function moveAll(){NET.conns.forEach(c=>{try{c.send({t:'move'})}catch(e){}});addChat('','Joining the other players in the main world…',true);
  setTimeout(()=>{netLeave();netStatus('connecting…');clearTimeout(NET.wait);NET.wait=setTimeout(()=>netJoin(0),400)},400)}
setInterval(probeLower,12000);
function gotChat(d){const m=cleanMsg(d.m);if(!m)return;if(d.sys)return addChat('',m,true);if(d.id===NET.id)return;const o=NET.others.get(d.id);addChat(o?o.n:clean(d.n,'Player'),m);if(o){o.say=m.slice(0,40);o.sayT=time+4}}
function hostSay(id,m,sys){const o=id&&NET.others.get(id),msg={t:'c',id:id||'',n:o?o.n:'',m,sys:sys?1:0};NET.conns.forEach(c=>{try{c.send(msg)}catch(e){}});gotChat(msg)}
function netChat(m){if(NET.host){const msg={t:'c',id:'host',n:S.name,m};NET.conns.forEach(c=>{try{c.send(msg)}catch(e){}})}else if(NET.hc&&NET.hc.open)try{NET.hc.send({t:'c',m})}catch(e){}}
function sendState(){if(!NET.host&&NET.hc&&NET.hc.open)try{NET.hc.send(myState())}catch(e){}}
function netTick(dt){if(!NET.peer)return;NET.acc+=dt;NET.bacc+=dt;
  if(NET.host){if(NET.bacc>.12){NET.bacc=0;if(NET.conns.size){const p={host:myState()};NET.others.forEach((o,k)=>{p[k]={n:o.n,x:Math.round(o.tx),y:Math.round(o.ty),f:o.f,d:o.d,m:o.m?1:0,lv:o.lv,lk:o.lk,seat:o.seat}});const msg={t:'w',p};NET.conns.forEach(c=>{try{c.send(msg)}catch(e){}})}
      const now=Date.now();NET.others.forEach((o,k)=>{if(now-o.seen>12000){const c=NET.conns.get(k);try{c&&c.close()}catch(e){}NET.conns.delete(k);NET.others.delete(k);countOn()}})}}
  else if(NET.acc>(P.mov?.15:1)){NET.acc=0;sendState()}}

/* ---------- start ---------- */
SFX.add({swing:()=>SFX.tone(300,0,.06,'square',.04,140),hit:()=>SFX.tone(180,0,.09,'sawtooth',.06,70),tick:()=>SFX.tone(880,0,.05,'triangle',.06,1320)});
const WORLD_SONG={bpm:92,lead:'triangle',arp:'triangle',ch:[[48,55,60,64],[45,52,57,60],[41,48,53,57],[43,50,55,59]],mel:[67,0,72,0,76,0,72,0, 69,0,72,0,76,0,0,0, 65,0,69,0,72,0,69,0, 67,0,71,0,74,0,0,0]};MUSIC.set(WORLD_SONG);
function begin(){started=true;hud();if(!S.hall){S.hall=1;save();setTimeout(()=>toast('New: the Arcade Hall is just south of the village!'),2400)}addChat('','Welcome to Pixel World, '+S.name+'! Tap the ground to walk. Tap a villager to talk.',true);netJoin(0);if(!Object.keys(S.q).length)setTimeout(()=>toast('Elder Oro is waiting in the square'),900)}
addEventListener('beforeunload',()=>{save();netLeave()});
addEventListener('pagehide',()=>{save();netLeave()});
setInterval(save,15000);
requestAnimationFrame(frame);
const enter=()=>{begin();if(TOUCH)goLandscape();checkRot()};
if(!S.look||!S.name)lookEditor(enter,true);
else if(TOUCH)dlg('Pixel World','Welcome back, '+S.name+'!\n\nThis world is played with your phone held sideways.',[{t:'Play',p:1,fn:enter},{t:'< Back to Arcade',fn:()=>{location.href='../'}}]);
else enter();
window._W={S,P,NET,tick,draw,talk,attack,findPath,slimes,ITEMS,QUESTS,NPCS,map,idx,shop,menu,TABLES,chairsOf,seatedAt,BOSS,BFLY,LOOT,openChest,EQUIP,equipAnim,enterArena,leaveArena,hitBoss,portalDlg,maxHP,dmg,sit,stand,startTable,goHere,tableDlg,goTable};
</script>
