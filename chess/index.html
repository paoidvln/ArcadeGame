<script>
const {el}=Arcade;
/*ENGINE*/
// Squares are numbered 0..63 from the top-left: 0 = a8, 7 = h8, 56 = a1, 63 = h1. White pieces are capital letters and move up the board.
const START='rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR'.split('').map(c=>c==='.'?'':c);
const col=p=>p?(p<'a'?0:1):-1;                       // 0 white, 1 black
const KN=[[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]],DG=[[1,1],[1,-1],[-1,1],[-1,-1]],ST=[[1,0],[-1,0],[0,1],[0,-1]],ALL=DG.concat(ST);
const VAL={p:1,n:3,b:3,r:5,q:9,k:0};
function attackedBy(b,sq,side){const r=sq>>3,f=sq&7,at=(rr,ff)=>rr<0||ff<0||rr>7||ff>7?null:b[rr*8+ff];
  const P=side?'p':'P',N=side?'n':'N',B=side?'b':'B',Rk=side?'r':'R',Q=side?'q':'Q',K=side?'k':'K',pr=side?r-1:r+1;
  if(at(pr,f-1)===P||at(pr,f+1)===P)return true;
  for(const[d,e]of KN)if(at(r+d,f+e)===N)return true;
  for(const[d,e]of ALL)if(at(r+d,f+e)===K)return true;
  for(const[d,e]of DG){let rr=r+d,ff=f+e,p;while((p=at(rr,ff))===''){rr+=d;ff+=e}if(p===B||p===Q)return true}
  for(const[d,e]of ST){let rr=r+d,ff=f+e,p;while((p=at(rr,ff))===''){rr+=d;ff+=e}if(p===Rk||p===Q)return true}
  return false}
function pseudo(s,from){const b=s.b,p=b[from];if(!p)return[];const side=col(p),r=from>>3,f=from&7,out=[],t=p.toLowerCase();
  const add=(rr,ff)=>{if(rr<0||ff<0||rr>7||ff>7)return false;const q=b[rr*8+ff];if(q&&col(q)===side)return false;out.push({t:rr*8+ff});return!q};
  if(t==='p'){const d=side?1:-1,start=side?1:6,last=side?7:0;
    if(b[(r+d)*8+f]===''){out.push({t:(r+d)*8+f,promo:r+d===last});if(r===start&&b[(r+2*d)*8+f]==='')out.push({t:(r+2*d)*8+f,dbl:1})}
    for(const e of[-1,1]){const ff=f+e;if(ff<0||ff>7)continue;const to=(r+d)*8+ff,q=b[to];if(q&&col(q)!==side)out.push({t:to,promo:r+d===last});else if(!q&&to===s.ep)out.push({t:to,ep:1})}}
  else if(t==='n')KN.forEach(([d,e])=>add(r+d,f+e));
  else if(t==='k'){ALL.forEach(([d,e])=>add(r+d,f+e));
    const h=(side?0:7)*8,rk=side?'r':'R';if(from===h+4&&!attackedBy(b,from,1-side)){
      if(s.cast[side?'k':'K']&&b[h+5]===''&&b[h+6]===''&&b[h+7]===rk&&!attackedBy(b,h+5,1-side))out.push({t:h+6,castle:'k'});
      if(s.cast[side?'q':'Q']&&b[h+3]===''&&b[h+2]===''&&b[h+1]===''&&b[h]===rk&&!attackedBy(b,h+3,1-side))out.push({t:h+2,castle:'q'})}}
  else{(t==='b'?DG:t==='r'?ST:ALL).forEach(([d,e])=>{let rr=r+d,ff=f+e;while(add(rr,ff)){rr+=d;ff+=e}})}
  return out}
// plays a move on s (board, castling rights, en-passant square, 50-move counter) and returns the captured piece, if any
function applyMove(s,from,m,promo){const b=s.b,p=b[from],side=col(p),t=p.toLowerCase();let cap=b[m.t];
  if(m.ep){const cs=(from>>3)*8+(m.t&7);cap=b[cs];b[cs]=''}
  b[m.t]=p;b[from]='';
  if(m.promo){const q='qrbn'.includes(promo)?promo:'q';b[m.t]=side?q:q.toUpperCase()}
  if(m.castle){const h=(side?0:7)*8;if(m.castle==='k'){b[h+5]=b[h+7];b[h+7]=''}else{b[h+3]=b[h];b[h]=''}}
  s.ep=m.dbl?(from+m.t)/2:-1;
  if(t==='k'){s.cast[side?'k':'K']=false;s.cast[side?'q':'Q']=false}
  [from,m.t].forEach(q=>{if(q===63)s.cast.K=false;if(q===56)s.cast.Q=false;if(q===7)s.cast.k=false;if(q===0)s.cast.q=false});
  s.half=(t==='p'||cap)?0:s.half+1;return cap}
const kingSq=(b,side)=>b.indexOf(side?'k':'K');
function legal(s,from){const side=col(s.b[from]);return pseudo(s,from).filter(m=>{const c={b:s.b.slice(),cast:Object.assign({},s.cast),ep:s.ep,half:0};applyMove(c,from,m);return!attackedBy(c.b,kingSq(c.b,side),1-side)})}
function allLegal(s,side){const out=[];for(let i=0;i<64;i++)if(s.b[i]&&col(s.b[i])===side)legal(s,i).forEach(m=>out.push({f:i,m}));return out}
function bare(b){const rest=b.filter(p=>p&&p.toLowerCase()!=='k').map(p=>p.toLowerCase());return rest.length===0||(rest.length===1&&(rest[0]==='b'||rest[0]==='n'))}
/*END*/
const name=sq=>'abcdefgh'[sq&7]+(8-(sq>>3));
const ART={
 p:["............","............","....kkkk....","...kaaaak...","...kaaabk...","....kaak....","...kaaaak...","....kabk....","...kaaabk...","..kaaaabbk..","..kkkkkkkk..","............"],
 r:["............","............",".kkk.kk.kkk.",".kakkaakkak.",".kaaaaaaabk.","..kkaaabkk..","...kaaabk...","...kaaabk...","...kaaabk...","..kkaaabkk..",".kaaaaaabbk.",".kkkkkkkkkk."],
 n:["............","....kkk.k...","...kaaakak..","..kaakaaabk.",".kaaaaaaabk.",".kaakkaaabk.","..kk.kaaabk.","....kaaabk..","...kaaaabk..","..kaaaaabbk.","..kkkkkkkkk.","............"],
 b:["............",".....kk.....","....kaak....","...kaakak...","...kaaabk...","...kaaabk...","....kabk....","...kaaabk...","....kabk....","...kaaabk...","..kaaaabbk..","..kkkkkkkk.."],
 q:["............","..k..kk..k..","..kk.kk.kk..","..kakaakak..","..kaaaaabk..","...kaaabk...","....kabk....","...kaaabk...","....kabk....","...kaaabk...","..kaaaabbk..","..kkkkkkkk.."],
 k:[".....kk.....","....kaak....",".....kk.....","....kkkk....","...kaaaak...","..kaaaaabk..","..kaaaaabk..","...kaaabk...","....kabk....","...kaaabk...","..kaaaabbk..","..kkkkkkkk.."]};
const svgC={};
function pieceSvg(p){if(svgC[p])return svgC[p];const c=col(p)?{k:'#0c0814',a:'#51427a',b:'#2c2344'}:{k:'#1a1026',a:'#fbf6ea',b:'#c9bfa6'};let r='';
  ART[p.toLowerCase()].forEach((row,y)=>{for(let x=0;x<12;x++){const ch=row[x];if(ch!=='.')r+='<rect x="'+x+'" y="'+y+'" width="1.03" height="1.03" fill="'+c[ch]+'"/>'}});
  return svgC[p]='<svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">'+r+'</svg>'}
const PN={p:'pawn',n:'knight',b:'bishop',r:'rook',q:'queen',k:'king'};
let CUR=null,CTX=null,sel=-1,targets=[],pend=null,seen=-1,cells=[],capBox=[null,null],clkBox=[null,null],sure=0,lastTc=5,lastT0=0,recvAt=0;
const TCS=[0,1,3,5,10];   // clock choices in minutes each; 0 = no clock
const flipped=()=>!!CTX&&CTX.controls(1)&&!CTX.controls(0);       // online, playing black: your pieces at the bottom
function paint(){const s=CUR;if(!s)return;const fl=flipped();
  cells.forEach((c,k)=>{const i=fl?63-k:k,p=s.b[i],tg=targets.find(m=>m.t===i);
    c.className='sq'+(((i>>3)+(i&7))&1?' d':'')+(s.last&&(s.last[0]===i||s.last[1]===i)?' last':'')+(sel===i?' sel':'')+(tg?' tg'+(p||tg.ep?' cap':''):'')+(s.chk>=0&&p===(s.chk?'k':'K')?' chk':'');
    c.innerHTML=(p?pieceSvg(p):'')+((fl?(i>>3)===0:(i>>3)===7)?'<i class="f">'+'abcdefgh'[i&7]+'</i>':'')+((fl?(i&7)===7:(i&7)===0)?'<i class="r">'+(8-(i>>3))+'</i>':'');
    c.setAttribute('aria-label',name(i)+(p?' '+(col(p)?'black ':'white ')+PN[p.toLowerCase()]:''))});
  [0,1].forEach(side=>{const box=capBox[fl?1-side:side],list=s.cap[side];box.innerHTML=list.map(pieceSvg).join('');const pts=list.reduce((a,p)=>a+VAL[p.toLowerCase()],0)-s.cap[1-side].reduce((a,p)=>a+VAL[p.toLowerCase()],0);if(pts>0)box.append(el('b',null,'+'+pts))});
  const pr=document.getElementById('promo');pr.classList.toggle('on',!!pend);
  if(pend){const side=col(s.b[pend.f]),row=pr.lastElementChild;row.innerHTML='';'qrbn'.split('').forEach(q=>{const b=el('button');b.type='button';b.innerHTML=pieceSvg(side?q:q.toUpperCase());b.setAttribute('aria-label',PN[q]);
      b.onclick=()=>{const a={k:'m',f:pend.f,t:pend.t,p:q};pend=null;CTX.act(a);paint()};row.append(b)})}}
function tap(k){const s=CUR;if(!s||!CTX.canAct())return;const i=flipped()?63-k:k,side=s.turn;pend=null;
  if(sel>=0){const m=targets.find(m=>m.t===i);if(m){if(m.promo){pend={f:sel,t:i};sel=-1;targets=[];return paint()}const a={k:'m',f:sel,t:i};sel=-1;targets=[];CTX.act(a);return paint()}}
  if(s.b[i]&&col(s.b[i])===side&&sel!==i){sel=i;targets=legal(s,i);Arcade.SFX.play('pick')}else{sel=-1;targets=[]}paint()}

// The clock. The host's copy decides; other screens count down from the moment the move reached them.
function paintClock(){const s=CUR;if(!s||!clkBox[0])return;const fl=flipped(),host=Arcade.run._&&Arcade.run._.S;
  [0,1].forEach(side=>{const e=clkBox[fl?1-side:side];if(!s.tc){e.style.display='none';return}e.style.display='';const run=side===s.turn&&!!s.t0&&!s.over;
    const ms=Math.max(0,s.clock[side]-(run?Date.now()-(host?s.t0:recvAt):0)),t=Math.ceil(ms/1000);e.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');e.className='clk'+(run?' run':'')+(ms<30000?' low':'')})}
setInterval(()=>{paintClock();const R=Arcade.run._,S=R&&R.S;   // only the host has S: it calls time when a clock reaches zero
  if(S&&!S.over&&!S.busy&&S.tc&&S.t0&&S.clock[S.turn]-(Date.now()-S.t0)<=0)R.dispatch(S.turn,{k:'flag'})},250);

Arcade.run({
  id:'chess',name:'Pixel Chess',title:'PIXEL CHESS',tag:'The classic duel of kings. Player 1 is White and moves first.',startLabel:'Start the match',min:2,max:2,
  intro:'♟ White moves first. Good luck!',
  bgColors:['#ffffff','#ffd9a0','#8a5cf0','#ffffff'],
  how:`<p>Tap one of your pieces, then tap a marked square to move it. A <b>green</b> mark is a free square, a <b>red</b> frame is a capture.</p>
<p>All the real rules are in: <b>castling</b> (move the king two squares), <b>en passant</b>, and <b>promotion</b> — when a pawn reaches the far side you choose a queen, rook, bishop or knight.</p>
<p>You may not leave your own king in check. <b>Checkmate</b> wins the game.</p>
<p>The game is a <b>draw</b> on stalemate, when neither side has enough pieces to mate, or after 50 moves each with no capture and no pawn move.</p>
<p><b>Clock:</b> before the first move, White picks the time each player gets — 1, 3, 5 or 10 minutes, or Off. Your clock runs only on your turn, starting after White's first move. If your time runs out, you lose — unless your opponent has only a king left, which is a draw.</p>
<p>Player 1 plays White. In an online room the host is White.</p>`,
  song:{bpm:84,lead:'triangle',arp:'triangle',ch:[[45,57,60,64],[43,55,59,62],[41,53,57,60],[40,52,56,59]],
    mel:[69,0,72,0,76,0,72,0, 71,0,74,0,79,0,74,0, 69,0,72,0,77,0,72,0, 68,0,71,0,76,0,0,0,
         81,0,0,79,0,76,0,0, 79,0,0,74,0,71,0,0, 77,0,0,76,0,72,0,0, 76,0,74,0,71,0,68,0]},
  sfx:({tone,noise,seq})=>({
    pick:()=>tone(660,0,.04,'square',.03,760),
    move:()=>{tone(220,0,.06,'square',.06,160);noise(0,.05,.03,1.2)},
    cap:()=>{tone(180,0,.1,'sawtooth',.07,80);noise(0,.12,.05,1.6)},
    check:()=>seq([880,660,880],.08,'square',.07),
    castle:()=>seq([330,440,330,440],.06,'square',.05)}),
  // clock: tc = minutes each (0 = off), clock = milliseconds left, t0 = when the side to move's clock started (0 = not running), n = moves made
  init:()=>({b:START.slice(),cast:{K:true,Q:true,k:true,q:true},ep:-1,half:0,last:null,cap:[[],[]],chk:-1,why:'',tc:lastTc,clock:[lastTc*60000,lastTc*60000],t0:0,n:0}),
  valid(s,seat,a){if(a.k==='resign')return true;if(a.k==='tc')return s.n===0&&seat===0&&TCS.includes(a.m);if(a.k==='flag')return!!(s.tc&&s.t0)&&s.clock[seat]-(Date.now()-s.t0)<=250;if(a.k!=='m'||!Number.isInteger(a.f)||!Number.isInteger(a.t)||a.f<0||a.f>63||a.t<0||a.t>63)return false;
    const p=s.b[a.f];return!!p&&col(p)===seat&&(a.p===undefined||'qrbn'.includes(a.p))&&legal(s,a.f).some(m=>m.t===a.t)},
  auto(s,i,api){const ms=allLegal(s,i);if(!ms.length)return{k:'resign'};const worth=x=>{const p=s.b[x.m.t];return p?VAL[p.toLowerCase()]:x.m.promo?8:0},best=Math.max(...ms.map(worth)),pool=ms.filter(x=>worth(x)===best),x=pool[api.rnd(pool.length)];
    return{k:'m',f:x.f,t:x.m.t,p:'q'}},
  async act(s,seat,a,api){const me=s.players[seat],opp=1-seat,you=s.players[opp];
    if(a.k==='resign'){s.over=true;s.winners=[opp];s.why=me.name+' resigned. '+you.name+' wins.';api.log('🏳️ '+me.name+' resigns.','bad');await api.step(500,{sfx:'bad'});return}
    if(a.k==='tc'){lastTc=a.m;s.tc=a.m;s.clock=[a.m*60000,a.m*60000];api.log(a.m?'⏱ Clock: '+a.m+' minute'+(a.m>1?'s':'')+' each.':'⏱ Clock switched off.');await api.step(100,{sfx:'pick'});return}
    const flag=async()=>{s.clock[seat]=0;s.over=true;const lone=s.b.filter(x=>x&&col(x)===opp).length===1;s.winners=lone?[0,1]:[opp];
      s.why=me.name+' ran out of time. '+(lone?you.name+' has only a king left, so the game is a draw.':you.name+' wins.');api.log('⏱ '+s.why,'gold');await api.step(700,{sfx:'bad',banner:{text:"TIME'S UP!",sub:lone?'Draw':you.name+' wins',c:'bad'}})};
    if(a.k==='flag')return flag();
    if(s.tc&&s.t0){const left=s.clock[seat]-(Date.now()-s.t0);if(left<=0)return flag();s.clock[seat]=left}
    const m=legal(s,a.f).find(m=>m.t===a.t),p=s.b[a.f],t=p.toLowerCase(),cap=applyMove(s,a.f,m,a.p);if(cap)s.cap[seat].push(cap);s.last=[a.f,a.t];s.n++;if(s.tc)s.t0=Date.now();
    const chk=attackedBy(s.b,kingSq(s.b,opp),seat),any=allLegal(s,opp).length>0;s.chk=chk?opp:-1;
    const txt=m.castle?(m.castle==='k'?'castles short':'castles long'):PN[t]+' '+name(a.f)+(cap?' takes on ':' to ')+name(a.t)+(m.promo?', promoted to '+PN['qrbn'.includes(a.p)?a.p:'q']:'')+(m.ep?' (en passant)':'');
    api.log((seat?'♟ ':'♙ ')+me.name+': '+txt+(chk&&any?' — check!':''),cap?'hi':'');

      else{s.winners=[0,1];s.why='Stalemate — '+you.name+' has no legal move. The game is a draw.';api.log('🤝 Stalemate. The game is a draw.','hi');await api.step(800,{sfx:'move',banner:{text:'STALEMATE',sub:'The game is a draw'}})}return}
    if(bare(s.b)||s.half>=100){s.over=true;s.winners=[0,1];s.why=s.half>=100?'Draw — 50 moves each without a capture or a pawn move.':'Draw — not enough pieces left to checkmate.';api.log('🤝 '+s.why,'hi');await api.step(800,{sfx:'move',banner:{text:'DRAW',sub:''}});return}
    s.turn=opp;await api.step(260,chk?{sfx:'check',banner:{text:'CHECK!',sub:you.name+"'s king is under attack",c:'bad'}}:{sfx:m.castle?'castle':cap?'cap':'move'})},
  status:(s,mine)=>s.busy?'…':mine?(s.chk===s.turn?'Your king is in check!':s.n===0?'Choose a clock, then make the first move':'Tap a piece, then a marked square'):null,
  score:(s,p)=>s.cap[p.id].reduce((a,x)=>a+VAL[x.toLowerCase()],0)+' pts',
  badge:(s,p)=>(p.id?'♟ Black':'♙ White')+(s.chk===p.id&&!s.over?' · CHECK':''),
  endText:s=>s.why,
  build(stage,s,ctx){const root=el('div');root.id='chess';const row=()=>{const r=el('div','caps'),c=el('span','cl'),k=el('span','clk');r.append(c,k);return{r,c,k}},T=row(),B=row(),top=T.r,bot=B.r,bw=el('div');bw.id='bw';const bd=el('div');bd.id='board';cells=[];
    for(let k=0;k<64;k++){const c=el('button','sq');c.type='button';c.onclick=()=>tap(k);cells.push(c);bd.append(c)}
    const pr=el('div');pr.id='promo';pr.append(el('p',null,'PROMOTE TO'),el('div'));bw.append(bd,pr);root.append(top,bw,bot);stage.append(root);capBox=[B.c,T.c];clkBox=[B.k,T.k];sel=-1;targets=[];pend=null},
  render(s,ctx,ctl){CUR=s;CTX=ctx;if(s.seq!==seen){seen=s.seq;sel=-1;targets=[];pend=null}if(s.t0!==lastT0){lastT0=s.t0;recvAt=Date.now()}paint();paintClock();
    if(!s.over&&s.n===0&&s.turn===0&&ctx.canAct()){const r=el('div','tcr');r.append(el('span',null,'Clock'));TCS.forEach(m=>{const b=el('button','small'+(s.tc===m?' on':''),m?m+' min':'Off');b.type='button';b.onclick=()=>ctx.act({k:'tc',m});r.append(b)});ctl.append(r)}
    if(!s.over&&ctx.canAct()){const b=el('button','alt','Resign');b.type='button';b.onclick=()=>{if(Date.now()-sure<2500){sure=0;ctx.act({k:'resign'})}else{sure=Date.now();b.textContent='Sure? Tap again';setTimeout(()=>{if(b.isConnected)b.textContent='Resign'},2500)}};ctl.append(b)}}
});
</script>
