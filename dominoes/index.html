<html lang="en">

<meta charset="utf-8">
<script data-arcade-version>window.AV='mwnkhgdo';fetch('../version.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j.v&&j.v!==AV){const u=new URL(location.href);if(u.searchParams.get('v')!==j.v){u.searchParams.set('v',j.v);location.replace(u)}}}).catch(()=>{});if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});try{if(localStorage.getItem('arcade-wand')!=='0')document.documentElement.classList.add('wand')}catch(e){};window.backTo=()=>{let u='../';try{u=sessionStorage.getItem('arcade-back')||u}catch(e){}location.href=u}</script>
<link data-pwa rel="manifest" href="../manifest.webmanifest">

<style>
:root{--bg:#0c1a12;--panel:#1c3d2a;--panel2:#12281c;--edge:#4fa86a;--accent:#d9a441;--accent-d:#7a5a1a;--accent-l:#ffe6a8;
  --alt:#4fa86a;--alt-d:#1f5a34;--alt-l:#b4f0c4;--dim:#a8c8b2;--hi:#b4f0c4}
#dom{width:min(100%,860px);margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ph2{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--hi);margin-bottom:8px;line-height:1.6;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ph2 b{font-weight:400;color:var(--gold)}
#table{min-height:130px;background:#1f5a34;border:4px solid #000;box-shadow:inset 0 0 0 4px #164527,0 0 0 4px #6b4a2b,8px 8px 0 #000;padding:14px 10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;align-content:center}
#table .empty{color:#b4f0c4;font-size:22px;text-align:center}
.d{display:inline-flex;flex:none;background:#f6f0e0;border:3px solid #000;box-shadow:inset -2px -2px 0 #cfc6ae,2px 2px 0 #0008}
.d.v{flex-direction:column}
.h{width:24px;height:24px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:3px;gap:1px}
.h i{display:block}.h i.p{background:#1a1026}
.d .h+.h{border-left:2px solid #1a1026}.d.v .h+.h{border-left:0;border-top:2px solid #1a1026}
.d.new{animation:drop .3s steps(4) backwards;box-shadow:inset -2px -2px 0 #cfc6ae,0 0 0 3px #ffd66b}
@keyframes drop{0%{transform:translateY(-14px);opacity:0}}
.d.back{background:#7a1f3a;box-shadow:inset -2px -2px 0 #4a0f22,inset 2px 2px 0 #b5486a,2px 2px 0 #0008}.d.back .h{width:9px;height:11px;padding:0}.d.back .h+.h{border:0}
#hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:64px}
#hand button{padding:5px;margin:0;background:var(--panel2);box-shadow:none;border:3px solid #000;line-height:0}
#hand button.ok{background:#2f7a48;border-color:#ffd66b;animation:pbob .8s steps(2) infinite}
#hand button.sel{background:#d9a441}
#hand button:disabled{opacity:.55}
#others{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center}
.op{display:flex;align-items:center;gap:6px;font-size:19px}.op .pa{width:26px;height:26px;display:inline-flex}.op .pa svg{width:100%;height:100%}.op .tl{display:flex;gap:2px;flex-wrap:wrap;max-width:150px}
.op.cur{color:var(--gold)}
#choice{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}#choice button{margin:0}
@media(max-width:719px){.h{width:19px;height:19px;padding:2px}#table{padding:10px 6px;gap:3px}}
</style>
</head>
<body>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../shared/arcade.js?v=mwnkhgdo"></script>
<script>
const {el}=Arcade;
const PIPS={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const half=n=>{const h=el('span','h');for(let i=0;i<9;i++)h.append(el('i',PIPS[n].includes(i)?'p':''));return h};
const tile=(a,b,vertical)=>{const d=el('span','d'+(vertical?' v':''));d.append(half(a),half(b));return d};
const back=()=>{const d=el('span','d v back');d.append(el('span','h'),el('span','h'));return d};
const ends=s=>s.chain.length?[s.chain[0][0],s.chain[s.chain.length-1][1]]:null;
// which ends a tile can go on: '' none, 'L', 'R' or 'LR'
function fits(s,t){const e=ends(s);if(!e)return'R';return(t[0]===e[0]||t[1]===e[0]?'L':'')+(t[0]===e[1]||t[1]===e[1]?'R':'')}
const canPlay=(s,seat)=>s.hands[seat].some(t=>fits(s,t));
const pipSum=h=>h.reduce((a,t)=>a+t[0]+t[1],0);
let CUR=null,CTX=null,pick=-1,seen=-1;
// whose hand this screen shows: on one shared device the player to move; in an online room always your own
// whose tiles to show: the person whose turn it is; on a computer's turn, the only person at this screen (or nobody, if several share it)
function viewer(s){if(CTX.controls(s.turn))return s.turn;const me=s.players.map((p,i)=>i).filter(i=>CTX.controls(i));return me.length===1?me[0]:-1}
function paint(){const s=CUR;if(!s)return;const e=ends(s),tb=document.getElementById('table'),v=viewer(s),can=CTX.canAct()&&v===s.turn;
  tb.innerHTML='';if(!s.chain.length)tb.append(el('div','empty','The table is empty. Play any tile to begin.'));
  s.chain.forEach((t,i)=>{const d=tile(t[0],t[1],t[0]===t[1]);if(s.lastAt===i)d.classList.add('new');tb.append(d)});
  document.getElementById('info').innerHTML='';document.getElementById('info').append(el('span',null,e?'ENDS: '+e[0]+' AND '+e[1]:'FIRST TILE'),el('b',null,'BONEYARD: '+s.yard.length));
  const ot=document.getElementById('others');ot.innerHTML='';s.players.forEach((p,i)=>{if(i===v)return;const o=el('div','op'+(i===s.turn&&!s.over?' cur':'')),pa=el('span','pa'),tl=el('span','tl');pa.innerHTML=CTX.avatar(p);
    (s.over?s.hands[i].map(t=>tile(t[0],t[1],true)):s.hands[i].map(back)).forEach(x=>tl.append(x));o.append(pa,p.name+' ('+s.hands[i].length+')',tl);ot.append(o)});
  const hd=document.getElementById('hand'),ch=document.getElementById('choice');hd.innerHTML='';ch.innerHTML='';
  document.getElementById('whose').textContent=v<0?"COMPUTER'S TURN":(s.players[v].name.toUpperCase()+"'S TILES");
  if(v<0)return;
  s.hands[v].forEach((t,i)=>{const f=fits(s,t),b=el('button',(can&&f?'ok':'')+(pick===i?' sel':''));b.type='button';b.append(tile(t[0],t[1],true));b.disabled=!can||!f;b.setAttribute('aria-label','Tile '+t[0]+' and '+t[1]);
    b.onclick=()=>{if(f.length===2&&e&&e[0]!==e[1]){pick=pick===i?-1:i;Arcade.SFX.play('click');return paint()}pick=-1;CTX.act({k:'p',i,e:f[0]})};hd.append(b)});
  if(pick>=0&&can&&e){const mk=(side,n)=>{const b=el('button','primary',(side==='L'?'◀ Left end ('+n+')':'Right end ('+n+') ▶'));b.type='button';b.onclick=()=>{const i=pick;pick=-1;CTX.act({k:'p',i,e:side})};return b};ch.append(mk('L',e[0]),mk('R',e[1]))}}

Arcade.run({
  id:'dominoes',name:'Dominoes',title:'DOMINOES',tag:'Match the ends, empty your hand first. A classic draw game for 2 to 4.',startLabel:'Deal the tiles',min:2,max:4,
  intro:'🁫 Seven tiles each. Player 1 leads with any tile.',
  bgColors:['#ffffff','#b4f0c4','#d9a441','#ffffff'],
  how:`<p>Everyone gets <b>7 tiles</b> from the double-six set. The rest is the <b>boneyard</b>.</p>
<p>On your turn, play a tile whose number matches <b>one of the two ends</b> of the line on the table. Tiles you can play are lit up. If a tile fits both ends, you choose the end.</p>
<p>If you cannot play, <b>draw</b> from the boneyard until you can. If the boneyard is empty, you <b>pass</b>.</p>
<p>The first player to play all their tiles <b>wins</b>.</p>
<p>If nobody can move, the game is <b>blocked</b>: the player with the fewest pips left in hand wins.</p>
<p>On one shared device the screen shows the tiles of whoever's turn it is, so look away when it is not your turn.</p>`,
  song:{bpm:104,lead:'triangle',arp:'triangle',ch:[[43,55,59,62],[48,55,60,64],[45,57,60,64],[50,57,62,66]],
    mel:[67,0,71,0,74,0,71,0, 72,0,76,0,79,0,76,0, 69,0,72,0,76,0,72,0, 74,0,78,0,81,0,0,0]},
  sfx:({tone,noise,seq})=>({clack:()=>{noise(0,.05,.09,2.2);tone(900,0,.03,'square',.05,400)},draw:()=>tone(300,0,.08,'triangle',.06,420),pass:()=>seq([294,220],.1,'square',.05),block:()=>seq([330,277,233,196],.12,'sawtooth',.06)}),
  init(players){const all=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)all.push([a,b]);const set=Arcade.shuffle(all).slice();
    return{hands:players.map(()=>set.splice(0,7)),yard:set,chain:[],passes:0,lastAt:-1,why:''}},
  valid(s,seat,a){const h=s.hands[seat],able=canPlay(s,seat);
    if(a.k==='p')return Number.isInteger(a.i)&&a.i>=0&&a.i<h.length&&(a.e==='L'||a.e==='R')&&(!s.chain.length||fits(s,h[a.i]).includes(a.e));
    if(a.k==='d')return!able&&s.yard.length>0;if(a.k==='x')return!able&&!s.yard.length;return false},
  bot(s,i,api,lvl){const h=s.hands[i],e=ends(s),opts=[];h.forEach((t,k)=>{for(const side of fits(s,t))opts.push({k,side,t})});
    if(!opts.length)return{k:s.yard.length?'d':'x'};if(lvl===1){const o=opts[Math.floor(Math.random()*opts.length)];return{k:'p',i:o.k,e:o.side}}
    const has=v=>h.filter(t=>t[0]===v||t[1]===v).length;let best=opts[0],bv=-1e9;
    opts.forEach(o=>{const t=o.t,open=!e?t[1]:o.side==='L'?(t[0]===e[0]?t[1]:t[0]):(t[0]===e[1]?t[1]:t[0]);
      const v=t[0]+t[1]+(t[0]===t[1]?5:0)+(has(open)-1)*(lvl===3?4:2)+Math.random();if(v>bv){bv=v;best=o}});
    return{k:'p',i:best.k,e:best.side}},
  auto(s,i){const h=s.hands[i];let best=-1,bv=-1;h.forEach((t,k)=>{if(fits(s,t)&&t[0]+t[1]+(t[0]===t[1]?3:0)>bv){bv=t[0]+t[1]+(t[0]===t[1]?3:0);best=k}});
    if(best>=0)return{k:'p',i:best,e:fits(s,h[best])[0]};return{k:s.yard.length?'d':'x'}},
  async act(s,seat,a,api){const p=s.players[seat],n=s.players.length,next=()=>{s.turn=(seat+1)%n};
    if(a.k==='d'){const t=s.yard.pop();s.hands[seat].push(t);s.lastAt=-1;api.log('🂠 '+p.name+' draws a tile. Boneyard: '+s.yard.length+'.');await api.step(350,{sfx:'draw'});return}
    if(a.k==='x'){s.passes++;s.lastAt=-1;api.log('⏭ '+p.name+' cannot play and passes.','hi');
      if(s.passes>=n){const sums=s.hands.map(pipSum),low=Math.min(...sums);s.over=true;s.winners=sums.map((v,i)=>v===low?i:-1).filter(i=>i>=0);
        s.why='Blocked — nobody can move. '+(s.winners.length>1?'A tie on '+low+' pips.':s.players[s.winners[0]].name+' has the fewest pips left ('+low+').');api.log('🚧 '+s.why,'gold');await api.step(900,{sfx:'block',banner:{text:'BLOCKED!',sub:'Fewest pips wins'}});return}
      next();await api.step(500,{sfx:'pass',toast:p.name+' passes'});return}
    const t=s.hands[seat].splice(a.i,1)[0],e=ends(s);
    if(!e){s.chain.push(t);s.lastAt=0}else if(a.e==='L'){s.chain.unshift(t[1]===e[0]?t:[t[1],t[0]]);s.lastAt=0}else{s.chain.push(t[0]===e[1]?t:[t[1],t[0]]);s.lastAt=s.chain.length-1}
    s.passes=0;api.log('🁫 '+p.name+' plays '+t[0]+'–'+t[1]+'. '+s.hands[seat].length+' left.',s.hands[seat].length===1?'hi':'');
    if(!s.hands[seat].length){s.over=true;s.winners=[seat];s.why=p.name+' played every tile!';api.log('🏆 '+s.why,'gold');await api.step(700,{sfx:'clack'});return}
    next();await api.step(300,{sfx:'clack',toast:s.hands[seat].length===1?p.name+' has one tile left!':''})},
  status:(s,mine)=>s.busy?'…':mine?(canPlay(s,s.turn)?'Tap a lit tile to play it':s.yard.length?'No tile fits — draw one':'No tile fits — you must pass'):null,
  score:(s,p)=>s.hands[p.id].length+' tiles',
  endText:s=>s.why,
  build(stage){const root=el('div');root.id='dom';const a=el('div','panel'),b=el('div','panel'),c=el('div','panel');
    const info=el('div','ph2');info.id='info';const tb=el('div');tb.id='table';a.append(info,tb);
    const ot=el('div');ot.id='others';b.append(ot);
    const wh=el('div','ph2');wh.id='whose';const hd=el('div');hd.id='hand';const ch=el('div');ch.id='choice';ch.style.marginTop='10px';c.append(wh,hd,ch);
    root.append(a,b,c);stage.append(root);pick=-1},
  render(s,ctx,ctl){CUR=s;CTX=ctx;if(s.seq!==seen){seen=s.seq;pick=-1}paint();
    if(!s.over&&ctx.canAct()&&!canPlay(s,s.turn))ctl.append(s.yard.length?ctx.button('Draw a tile',{k:'d'}):ctx.button('Pass',{k:'x'},'alt'))}
});
</script>
